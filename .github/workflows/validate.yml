name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # check_migrations.py сравнивает с базой; обрезанная история его ломает

      - name: JSON-манифесты валидны
        run: |
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          python3 -m json.tool plugins/qtim/.claude-plugin/plugin.json > /dev/null
          python3 -m json.tool plugins/qtim/hooks/hooks.json > /dev/null
          python3 -m json.tool examples/nuxt-supabase/.claude/settings.json > /dev/null
          python3 -m json.tool examples/nuxt-supabase/.claude/settings.local.json > /dev/null

      - name: Канон рантайма — call-синтаксис упразднённых примитивов запрещён (plugins/ + examples/)
        run: |
          if grep -rnE 'TeamCreate\(|TeamDelete\(|team_name\s*:' plugins/ examples/; then
            echo 'Найден call-синтаксис упразднённых примитивов (TeamCreate(/TeamDelete(/team_name:)' >&2
            exit 1
          fi
          echo 'OK: call-синтаксис упразднённых примитивов не встречается'

      - name: Hook-скрипты синтаксически валидны (sh на Linux = dash)
        run: |
          found=0
          for f in $(find plugins/qtim -name '*.sh' | sort); do
            sh -n "$f" || exit 1
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo 'Не найдено ни одного .sh — проверка молча деградировала' >&2
            exit 1
          fi
          echo "OK: $found hook-скрипт(ов) синтаксически валидны"

      - name: Python-скрипты плагина парсятся как Python 3.9 (ноль файлов = fail)
        run: |
          # Нижняя граница — системный python3 macOS (3.9.6): скрипты плагина ставятся в чужие проекты.
          # ast ловит синтаксис новее 3.9 (match, скобочные with), но не рантайм-API (int.bit_count) и не
          # `int | None` в аннотациях — их закрывает обязательный `from __future__ import annotations`.
          found=0
          for f in $(find plugins/qtim -name '*.py' | sort); do
            python3 -c 'import ast, sys; p = sys.argv[1]; ast.parse(open(p, encoding="utf-8").read(), p, feature_version=(3, 9))' "$f" || {
              echo "$f: не парсится как Python 3.9 — скрипты плагина обязаны работать на python3 >= 3.9 без зависимостей; перепиши конструкцию" >&2
              exit 1
            }
            grep -q '^from __future__ import annotations' "$f" || {
              echo "$f: нет 'from __future__ import annotations' — добавь первой инструкцией после docstring" >&2
              exit 1
            }
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo 'Не найдено ни одного .py в plugins/qtim — ожидался skills/kb-format/scripts/kb_scan.py; проверка молча деградировала бы' >&2
            exit 1
          fi
          echo "OK: $found python-скрипт(ов) плагина парсятся как Python 3.9"

      - name: kb_scan.py selftest — ломающие входы ловятся
        run: python3 plugins/qtim/skills/kb-format/scripts/kb_scan.py selftest

      - name: Плейсхолдеры шаблонов из белого списка
        run: python3 .github/scripts/check_placeholders.py

      - name: Workflow-скрипты синтаксически валидны
        run: node .github/scripts/check_workflows.mjs plugins/qtim/workflows/*.mjs

      - name: Относительные ссылки в plugins/ не биты
        run: python3 .github/scripts/check_links.py

      - name: Golden-эталон семантически валиден
        run: python3 .github/scripts/check_golden.py

      - name: Ссылки на скилы резолвятся, имена совпадают с каталогами
        run: python3 .github/scripts/check_skill_refs.py

      - name: Правка сгенерированного несёт запись в реестр миграций
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          # Первый push в ветку отдаёт нулевой sha в github.event.before — откатываемся на предыдущий коммит.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          CHECK_MIGRATIONS_BASE="$base" python3 .github/scripts/check_migrations.py
